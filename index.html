<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:#0D1321; --surface:#141B2D; --surface2:#1B2338; --border:#28324A;
  --text:#EDEAE0; --textDim:#8A93A8; --textFaint:#525C73;
  --gold:#CBA135; --goldDim:#8A6E28; --bull:#2FA98C; --bear:#D65C5C;
  --bullBg:#12261F; --bearBg:#2A1616; --onGold:#1B1305;
}
[data-theme="light"]{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface2:#EBE8DE; --border:#D9D5C7;
  --text:#1B1F2A; --textDim:#5C6273; --textFaint:#9A968A;
  --gold:#9C7A1F; --goldDim:#C7A94D; --bull:#1E8267; --bear:#B23F3F;
  --bullBg:#E3F0EA; --bearBg:#F5E4E1; --onGold:#FFFFFF;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif; display:flex; justify-content:center;
  min-height:100vh; padding:20px 0;
}
.app{
  width:100%; max-width:420px; min-height:640px; background:var(--bg); color:var(--text);
  border-radius:16px; padding:22px 20px 28px; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.screen{display:none; flex-direction:column; flex:1;}
.screen.active{display:flex;}
button{font-family:inherit; cursor:pointer;}
.icon-btn{background:none;border:none;color:var(--textDim);}
.header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.back-btn{background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
.header h2{font-size:16px;font-weight:700;margin:0;line-height:1.3;}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;}
.eyebrow{font-size:11px;color:var(--gold);letter-spacing:1.5px;margin-bottom:6px;}
.h1{font-size:24px;font-weight:700;}
.stat-row{display:flex;gap:10px;margin-bottom:22px;}
.stat-card{flex:1;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;}
.stat-value{font-size:20px;font-weight:600;margin-top:4px;}
.btn-primary{background:var(--gold);color:var(--onGold);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;width:100%;box-shadow:0 6px 16px -8px rgba(203,161,53,0.55);}
.btn-primary:active, .btn-nav:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.45;box-shadow:none;}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.btn-nav{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:12px;font-size:13px;color:var(--text);}
.section-label{font-size:11px;color:var(--textFaint);margin-bottom:10px;letter-spacing:1px;}
.level-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.level-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;}
.level-row.locked{opacity:0.5;}
.level-row.current{background:var(--surface);}
.level-title{font-size:13.5px;font-weight:500;}
.level-topics{font-size:11.5px;color:var(--textDim);}
.progress-bar-row{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;}
.progress-seg{flex:1;min-width:6px;height:3px;border-radius:2px;background:var(--border);}
.lesson-card{flex:1;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;justify-content:center;gap:14px;box-shadow:0 10px 26px -18px rgba(0,0,0,0.5);}
.lesson-title{font-size:17px;font-weight:700;}
.lesson-body{font-size:14px;line-height:1.6;color:var(--textDim);}
.lesson-nav{display:flex;gap:10px;margin-top:18px;}
.quiz-question{font-size:15.5px;font-weight:700;margin-bottom:16px;line-height:1.4;}
.quiz-diagram{margin-bottom:16px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:10px;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.quiz-opt{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;font-size:13.5px;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.quiz-opt.correct{background:var(--bullBg);border-color:var(--bull);}
.quiz-opt.wrong{background:var(--bearBg);border-color:var(--bear);}
.quiz-opt:disabled{cursor:default;}
.exp-box{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.55;border:1px solid var(--border);background:var(--surface);}
.exp-box.correct{border-color:var(--bull);background:var(--bullBg);}
.exp-box.wrong{border-color:var(--bear);background:var(--bearBg);}
.exp-label{font-size:11px;font-weight:700;letter-spacing:0.5px;margin-bottom:4px;text-transform:uppercase;}
.exp-label.correct{color:var(--bull);}
.exp-label.wrong{color:var(--bear);}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;}
.result-icon{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.settings-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.theme-btn{background:var(--surface2);border:0.5px solid var(--border);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--gold);}
.score-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
svg.candle-icon line, svg.candle-icon rect{transition:none;}
.faint{color:var(--textFaint);font-size:13px;}
.ex-instruction{font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:14px;}
.ex-chart-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:10px;margin-bottom:6px;}
.ex-chart-wrap svg{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation;}
.ex-hint{font-size:12px;color:var(--textFaint);text-align:center;margin-bottom:10px;}
</style>
</head>
<body>
<div class="app" id="app" data-theme="dark">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="top-row">
      <div>
        <div class="eyebrow">АКАДЕМИЯ ТРЕЙДИНГА</div>
        <div class="h1 display">С нуля до графика</div>
      </div>
      <button class="icon-btn" onclick="showScreen('settings')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label" style="color:var(--gold)">🏆 XP</div>
        <div class="stat-value mono" id="home-xp">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" style="color:var(--bull)">✓ Уровни</div>
        <div class="stat-value mono" id="home-levels">0/10</div>
      </div>
    </div>

    <button class="btn-primary" onclick="openNextLevel()">▶ Продолжить обучение</button>

    <div class="nav-grid">
      <button class="btn-nav" onclick="showScreen('progress')">📊 Мой прогресс</button>
      <button class="btn-nav" onclick="showScreen('certificate')">🏅 Сертификат</button>
    </div>

    <div class="section-label mono">ПУТЬ ОБУЧЕНИЯ</div>
    <div class="level-list" id="level-list"></div>
  </div>

  <!-- LESSON -->
  <div class="screen" id="screen-lesson">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display" id="lesson-title"></h2>
    </div>
    <div class="progress-bar-row" id="lesson-progress"></div>
    <div class="lesson-card">
      <div id="lesson-illustration"></div>
      <div class="lesson-title display" id="lesson-slide-title"></div>
      <div class="lesson-body" id="lesson-slide-body"></div>
    </div>
    <div class="lesson-nav">
      <button class="btn-nav" id="lesson-back-btn" style="flex:1;display:none;" onclick="prevSlide()">Назад</button>
      <button class="btn-primary" style="flex:2;margin-bottom:0;" id="lesson-next-btn" onclick="nextSlide()">Далее</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="header">
      <button class="back-btn" onclick="showScreen('lesson')">←</button>
      <h2 class="display" id="quiz-title"></h2>
    </div>
    <div class="progress-bar-row" id="quiz-progress"></div>
    <div class="quiz-diagram" id="quiz-diagram" style="display:none;"></div>
    <div class="quiz-question" id="quiz-question"></div>
    <div class="quiz-opts" id="quiz-opts"></div>
    <div id="quiz-exp"></div>
    <div style="flex:1;"></div>
    <button class="btn-primary" id="quiz-next-btn" style="display:none;margin-top:14px;" onclick="advanceQuiz()">Далее</button>
  </div>

  <!-- EXERCISE (interactive tap levels 4 & 9) -->
  <div class="screen" id="screen-exercise">
    <div class="header">
      <button class="back-btn" onclick="showScreen('lesson')">←</button>
      <h2 class="display" id="ex-title"></h2>
    </div>
    <div class="progress-bar-row" id="ex-progress"></div>
    <div class="ex-instruction" id="ex-instruction"></div>
    <div class="ex-chart-wrap" id="ex-chart-wrap"></div>
    <div class="ex-hint" id="ex-hint">Нажмите прямо на график</div>
    <div id="ex-exp"></div>
    <div style="flex:1;"></div>
    <button class="btn-primary" id="ex-next-btn" style="display:none;" onclick="advanceExercise()">Далее</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="center-col">
      <div class="result-icon" id="result-icon"></div>
      <div class="display" style="font-size:20px;font-weight:700;" id="result-title"></div>
      <div class="mono" style="font-size:15px;color:var(--textDim);" id="result-score"></div>
      <div class="faint" style="max-width:260px;" id="result-msg"></div>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="btn-nav" id="retry-btn" onclick="retryCurrent()" style="display:none;">↻ Повторить</button>
        <button style="background:var(--gold);color:var(--onGold);border:none;border-radius:10px;padding:12px 18px;font-size:13.5px;font-weight:600;" onclick="showScreen('home')">На главную</button>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="screen" id="screen-progress">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display">Мой прогресс</h2>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="faint">Всего XP</div><div class="stat-value mono" id="prog-xp">0</div></div>
      <div class="stat-card"><div class="faint">Пройдено</div><div class="stat-value mono" id="prog-levels">0/10</div></div>
    </div>
    <div class="section-label mono">РЕЗУЛЬТАТЫ ТЕСТОВ</div>
    <div id="prog-scores"></div>
  </div>

  <!-- CERTIFICATE -->
  <div class="screen" id="screen-certificate">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display">Сертификат</h2>
    </div>
    <div class="center-col" id="cert-body"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display">Настройки</h2>
    </div>
    <div class="settings-row">
      <span style="font-size:13.5px;">Тема оформления</span>

/* ============ CANDLESTICK CHART ENGINE ============ */
/* value scale: 0 = top of chart (highest price), larger = lower price */

function buildCandleSVG(candles, opts){
  opts = opts || {};
  const w = 260, h = opts.height || 130, padT = 12, padB = 12;
  const domain = opts.domain || 100;
  const n = candles.length;
  const step = w / n;
  const bull = "var(--bull)", bear = "var(--bear)", gold = "var(--gold)", textFaint = "var(--textFaint)";

  function toY(v){ return padT + (v/domain) * (h - padT - padB); }

  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" data-domain="${domain}" data-h="${h}" data-padt="${padT}" data-padb="${padB}">`;

  if(opts.lines){
    opts.lines.forEach(ln => {
      const y = toY(ln.v);
      svg += `<line x1="4" y1="${y}" x2="${w-4}" y2="${y}" stroke="${ln.color||gold}" stroke-width="1.3" stroke-dasharray="4 3"/>`;
      if(ln.label) svg += `<text x="${w-4}" y="${y-4}" font-size="9" text-anchor="end" fill="${ln.color||gold}">${ln.label}</text>`;
    });
  }

  candles.forEach((c,i) => {
    const cx = i*step + step/2;
    const bw = Math.max(step*0.5, 6);
    const yO = toY(c.o), yC = toY(c.c), yH = toY(c.h), yL = toY(c.l);
    const isBull = c.c < c.o;
    const color = isBull ? bull : bear;
    const bodyTop = Math.min(yO,yC), bodyH = Math.max(Math.abs(yC-yO), 2.2);
    svg += `<line x1="${cx}" y1="${yH}" x2="${cx}" y2="${yL}" stroke="${color}" stroke-width="1.4"/>`;
    svg += `<rect x="${cx-bw/2}" y="${bodyTop}" width="${bw}" height="${bodyH}" fill="${color}" rx="1"/>`;
  });

  if(opts.markers){
    opts.markers.forEach(m => {
      const cx = (m.i!==undefined) ? (m.i*step + step/2) : (m.x!==undefined ? m.x : w/2);
      const y = toY(m.v);
      svg += `<circle cx="${cx}" cy="${y}" r="5.5" fill="${m.color||gold}" stroke="${opts.bgColor||'var(--surface)'}" stroke-width="1.5"/>`;
      if(m.label) svg += `<text x="${cx}" y="${y - 10}" font-size="10" text-anchor="middle" font-weight="700" fill="${m.color||gold}">${m.label}</text>`;
    });
  }

  svg += `</svg>`;
  return svg;
}

function svgYToValue(svgEl, clientY){
  const rect = svgEl.getBoundingClientRect();
  const h = parseFloat(svgEl.getAttribute("data-h"));
  const padT = parseFloat(svgEl.getAttribute("data-padt"));
  const padB = parseFloat(svgEl.getAttribute("data-padb"));
  const domain = parseFloat(svgEl.getAttribute("data-domain"));
  const relY = (clientY - rect.top) / rect.height * h;
  const value = (relY - padT) / (h - padT - padB) * domain;
  return value;
}

  {o:50,h:25,l:75,c:60},{o:60,h:35,l:68,c:45},{o:45,h:38,l:62,c:52},
  {o:52,h:40,l:58,c:48},{o:48,h:42,l:55,c:46},{o:46,h:20,l:50,c:25},
];

function chartFor(level, slideIdx){
  switch(level){
    case 3: {
      const sets = [CANDLES_UP, CANDLES_DOWN, CANDLES_RANGE];
      return buildCandleSVG(sets[slideIdx % sets.length], {height:100});
    }
    case 4: {
      return buildCandleSVG(CANDLES_SR, {height:120, lines:[
        {v:SR_SUPPORT, color:"var(--bull)", label:"поддержка"},
        {v:SR_RESISTANCE, color:"var(--bear)", label:"сопротивление"},
      ]});
    }
    case 5: {
      const sets = [CANDLES_HEAD_SHOULDERS, CANDLES_DOUBLE_TOP, CANDLES_DOUBLE_BOTTOM, CANDLES_FLAG, CANDLES_TRIANGLE];
      return buildCandleSVG(sets[slideIdx % sets.length], {height:100});
    }
    case 6: {
      return buildCandleSVG(CANDLES_RANGE, {height:100});
    }
    case 7: {
      const sets = [CANDLES_PATTERN_PIN, CANDLES_PATTERN_ENGULF];
      return buildCandleSVG(sets[slideIdx % sets.length], {height:100});
    }
    case 9: {
      return buildCandleSVG(CANDLES_PRACTICE, {height:120, domain:110, lines:[
        {v:PRACTICE_ENTRY, color:"var(--bull)", label:"поддержка"},
      ]});
    }
    default: return "";
  }
}

/* ============ STATE ============ */

let progress = { xp: 0, completed: [], scores: {} };
let activeLevel = 1;
let slideIdx = 0;
let quizIdx = 0;
let quizAnswers = [];
let selectedOpt = null;
let quizAnswered = false;
let exIdx = 0;
let exResults = [];
let exAnswered = false;

/* ============ PERSISTENCE ============ */

function loadProgress(){
  try{
    const raw = localStorage.getItem("ta_progress");
    if(raw) progress = JSON.parse(raw);
  }catch(e){}
}
function saveProgress(){
  localStorage.setItem("ta_progress", JSON.stringify(progress));
}

function isUnlocked(id){ return id === 1 || progress.completed.includes(id - 1); }
function isDone(id){ return progress.completed.includes(id); }
function nextIncompleteLevel(){
  const found = LEVEL_META.find(l => !isDone(l.id));
  return found ? found.id : 1;
}

/* ============ NAVIGATION ============ */

function showScreen(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  if(name === "home") renderHome();
  if(name === "progress") renderProgress();
  if(name === "certificate") renderCertificate();
  if(name === "settings") renderSettings();
}

function candleSvg(status, size){
  const color = status === "done" ? "var(--bull)" : status === "current" ? "var(--gold)" : "var(--textFaint)";
  const fill = status === "locked" ? "none" : color;
  const h = size * 1.4;
  return `<svg class="candle-icon" width="${size}" height="${h}" viewBox="0 0 20 28">
    <line x1="10" y1="1" x2="10" y2="27" stroke="${color}" stroke-width="1.6"/>
    <rect x="4" y="8" width="12" height="12" fill="${fill}" stroke="${color}" stroke-width="1.6" rx="1.5"/>
  </svg>`;
}

function renderHome(){
  document.getElementById("home-xp").textContent = progress.xp;
  document.getElementById("home-levels").textContent = progress.completed.length + "/10";
  const list = document.getElementById("level-list");
  list.innerHTML = "";
  LEVEL_META.forEach(lvl => {
    const unlocked = isUnlocked(lvl.id);
    const done = isDone(lvl.id);
    const status = done ? "done" : unlocked ? "current" : "locked";
    const row = document.createElement("div");
    row.className = "level-row" + (unlocked ? " current" : " locked");
    row.style.cursor = unlocked ? "pointer" : "default";
    row.innerHTML = `
      ${candleSvg(status, 26)}
      <div style="flex:1;">
        <div class="level-title">${lvl.id}. ${lvl.title}</div>
        <div class="level-topics">${lvl.topics.slice(0,3).join(" · ")}</div>
      </div>
      ${!unlocked ? '<span style="color:var(--textFaint);font-size:14px;">🔒</span>' : ""}
      ${done ? '<span style="color:var(--bull);font-size:15px;">✓</span>' : ""}
    `;
    if(unlocked) row.onclick = () => openLevel(lvl.id);
    list.appendChild(row);
  });
}

function openNextLevel(){ openLevel(nextIncompleteLevel()); }

function openLevel(id){
  if(!isUnlocked(id)) return;
  activeLevel = id;
  slideIdx = 0;
  if(id === 10){
    startQuiz();
  } else {
    showScreen("lesson");
    renderLesson();
  }
}

function currentSlides(){ return LESSONS[activeLevel] || []; }
function currentQuiz(){ return QUIZZES[activeLevel] || []; }

/* ============ LESSON ============ */

function renderLesson(){
  const slides = currentSlides();
  document.getElementById("lesson-title").textContent = `Урок ${activeLevel}: ${LEVEL_META[activeLevel-1].title}`;
  const bar = document.getElementById("lesson-progress");
  bar.innerHTML = slides.map((_, i) => `<div class="progress-seg" style="background:${i <= slideIdx ? 'var(--gold)' : 'var(--border)'}"></div>`).join("");
  document.getElementById("lesson-slide-title").textContent = slides[slideIdx].h;
  document.getElementById("lesson-slide-body").textContent = slides[slideIdx].b;
  document.getElementById("lesson-back-btn").style.display = slideIdx > 0 ? "block" : "none";
  const isLast = slideIdx + 1 >= slides.length;
  document.getElementById("lesson-next-btn").textContent = isLast ? (EXERCISES[activeLevel] ? "К практике →" : "К тесту →") : "Далее";
  renderIllustration();
}

function renderIllustration(){
  const box = document.getElementById("lesson-illustration");
  const chart = chartFor(activeLevel, slideIdx);
  if(chart){
    box.innerHTML = chart;
    return;
  }
  const gold = "var(--gold)", bull = "var(--bull)", bear = "var(--bear)", border = "var(--border)", text = "var(--textDim)";
  let svg = "";
  switch(activeLevel){
    case 1: {
      const bars = [40,65,30,80,55];
      svg = `<svg width="100%" height="90" viewBox="0 0 260 90">${bars.map((h,i) => `<rect x="${20+i*48}" y="${90-h}" width="26" height="${h}" rx="3" fill="${i === slideIdx % bars.length ? gold : border}"/>`).join("")}</svg>`;
      break;
    }
    case 2: {
      const bull2 = slideIdx % 2 === 0;
      const color = bull2 ? bull : bear;
      svg = `<svg width="100%" height="100" viewBox="0 0 260 100"><line x1="130" y1="15" x2="130" y2="85" stroke="${color}" stroke-width="2.5"/><rect x="105" y="${bull2?55:25}" width="50" height="32" fill="${color}" rx="2"/></svg>`;
      break;
    }
    case 8: {
      svg = `<svg width="100%" height="90" viewBox="0 0 260 90"><circle cx="130" cy="46" r="34" fill="none" stroke="${border}" stroke-width="10"/><path d="M130,12 A34,34 0 0,1 158,60" fill="none" stroke="${gold}" stroke-width="10"/></svg>`;
      break;
    }
    default: svg = "";
  }
  box.innerHTML = svg;
}

function nextSlide(){
  const slides = currentSlides();
  if(slideIdx + 1 < slides.length){ slideIdx++; renderLesson(); }
  else {
    if(EXERCISES[activeLevel]) startExercise();
    else startQuiz();
  }
}
function prevSlide(){ if(slideIdx>0){ slideIdx--; renderLesson(); } }

/* ============ QUIZ (with explanations) ============ */

function startQuiz(){
  quizIdx = 0; quizAnswers = []; selectedOpt = null; quizAnswered = false;
  showScreen("quiz");
  renderQuiz();
}

function renderQuiz(){
  const quiz = currentQuiz();
  const isExam = activeLevel === 10;
  document.getElementById("quiz-title").textContent = isExam
    ? `Экзамен: вопрос ${quizIdx+1} из ${quiz.length}`
    : `Тест: вопрос ${quizIdx+1} из ${quiz.length}`;
  const bar = document.getElementById("quiz-progress");
  bar.innerHTML = quiz.map((_,i) => `<div class="progress-seg" style="background:${i<quizIdx?'var(--gold)':i===quizIdx?'var(--textDim)':'var(--border)'}"></div>`).join("");
  document.getElementById("quiz-diagram").style.display = "none";
  document.getElementById("quiz-diagram").innerHTML = "";
  const q = quiz[quizIdx];
  document.getElementById("quiz-question").textContent = q.q;
  const opts = document.getElementById("quiz-opts");
  opts.innerHTML = "";
  selectedOpt = null; quizAnswered = false;
  document.getElementById("quiz-exp").innerHTML = "";
  document.getElementById("quiz-next-btn").style.display = "none";
  q.opts.forEach((opt,i) => {
    const btn = document.createElement("button");
    btn.className = "quiz-opt";
    btn.textContent = opt;
    btn.onclick = () => pickAnswer(i);
    opts.appendChild(btn);
  });
}

function pickAnswer(i){
  if(quizAnswered) return;
  quizAnswered = true;
  selectedOpt = i;
  const quiz = currentQuiz();
  const q = quiz[quizIdx];
  const isCorrect = i === q.a;
  quizAnswers.push(isCorrect);
  const optButtons = document.querySelectorAll("#quiz-opts .quiz-opt");
  optButtons.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === q.a) btn.classList.add("correct");
    else if(idx === i) btn.classList.add("wrong");
  });
  const expBox = document.getElementById("quiz-exp");
  expBox.innerHTML = `<div class="exp-box ${isCorrect?'correct':'wrong'}">
    <div class="exp-label ${isCorrect?'correct':'wrong'}">${isCorrect?'Верно':'Неверно'}</div>
    ${q.exp || ""}
  </div>`;
  const isLast = quizIdx + 1 >= quiz.length;
  const nextBtn = document.getElementById("quiz-next-btn");
  nextBtn.style.display = "flex";
  nextBtn.textContent = isLast ? "Завершить тест" : "Далее";
}

function advanceQuiz(){
  const quiz = currentQuiz();
  if(quizIdx + 1 < quiz.length){
    quizIdx++;
    renderQuiz();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const correctCount = quizAnswers.filter(Boolean).length;
  const pct = Math.round((correctCount / quizAnswers.length) * 100);
  const passed = pct >= thresholdFor(activeLevel);
  progress.scores[activeLevel] = pct;
  progress.xp += correctCount * 10;
  if(passed && !progress.completed.includes(activeLevel)){
    progress.completed.push(activeLevel);
    progress.xp += 50;
  }
  saveProgress();
  renderResult(pct, passed, activeLevel === 10 ? "экзамен" : "тест");
  showScreen("result");
}

/* ============ INTERACTIVE EXERCISES ============ */

function startExercise(){
  exIdx = 0; exResults = []; exAnswered = false;
  showScreen("exercise");
  renderExercise();
}

function renderExercise(){
  const ex = EXERCISES[activeLevel];
  const step = ex.steps[exIdx];
  document.getElementById("ex-title").textContent = ex.title;
  const bar = document.getElementById("ex-progress");
  bar.innerHTML = ex.steps.map((_,i) => `<div class="progress-seg" style="background:${i<exIdx?'var(--gold)':i===exIdx?'var(--textDim)':'var(--border)'}"></div>`).join("");
  document.getElementById("ex-instruction").textContent = step.instruction;
  const wrap = document.getElementById("ex-chart-wrap");
  wrap.innerHTML = buildCandleSVG(step.candles, {height: step.height, domain: step.domain});
  exAnswered = false;
  document.getElementById("ex-hint").style.display = "block";
  document.getElementById("ex-exp").innerHTML = "";
  document.getElementById("ex-next-btn").style.display = "none";
  const svgEl = wrap.querySelector("svg");
  svgEl.onclick = (evt) => handleExerciseTap(evt, svgEl, step);
}

function handleExerciseTap(evt, svgEl, step){
  if(exAnswered) return;
  exAnswered = true;
  const rect = svgEl.getBoundingClientRect();
  const value = svgYToValue(svgEl, evt.clientY);
  const isCorrect = Math.abs(value - step.target) <= step.tolerance;
  exResults.push(isCorrect);

  const clickYRatio = (evt.clientY - rect.top) / rect.height;
  const vb = svgEl.viewBox.baseVal;
  const markY = clickYRatio * vb.height;
  const markX = ((evt.clientX - rect.left) / rect.width) * vb.width;
  const markerColor = isCorrect ? "var(--bull)" : "var(--bear)";
  const marker = document.createElementNS("http://www.w3.org/2000/svg","circle");
  marker.setAttribute("cx", markX);
  marker.setAttribute("cy", markY);
  marker.setAttribute("r", "7");
  marker.setAttribute("fill", "none");
  marker.setAttribute("stroke", markerColor);
  marker.setAttribute("stroke-width", "2.5");
  svgEl.appendChild(marker);

  const targetY = (step.target/(step.domain||100)) * (svgEl.getAttribute("data-h") - 24) + 12;
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1","4"); line.setAttribute("x2","256");
  line.setAttribute("y1", targetY); line.setAttribute("y2", targetY);
  line.setAttribute("stroke", "var(--gold)");
  line.setAttribute("stroke-width","1.2");
  line.setAttribute("stroke-dasharray","2 3");
  svgEl.appendChild(line);

  document.getElementById("ex-hint").style.display = "none";
  document.getElementById("ex-exp").innerHTML = `<div class="exp-box ${isCorrect?'correct':'wrong'}">
    <div class="exp-label ${isCorrect?'correct':'wrong'}">${isCorrect?'Верно':'Мимо'}</div>
    ${isCorrect ? step.expCorrect : step.expWrong}
  </div>`;
  const ex = EXERCISES[activeLevel];
  const isLast = exIdx + 1 >= ex.steps.length;
  const nextBtn = document.getElementById("ex-next-btn");
  nextBtn.style.display = "flex";
  nextBtn.textContent = isLast ? "Завершить" : "Далее";
}

function advanceExercise(){
  const ex = EXERCISES[activeLevel];
  if(exIdx + 1 < ex.steps.length){
    exIdx++;
    renderExercise();
  } else {
    finishExercise();
  }
}

function finishExercise(){
  const correctCount = exResults.filter(Boolean).length;
  const pct = Math.round((correctCount / exResults.length) * 100);
  const passed = pct >= thresholdFor(activeLevel);
  progress.scores[activeLevel] = pct;
  progress.xp += correctCount * 15;
  if(passed && !progress.completed.includes(activeLevel)){
    progress.completed.push(activeLevel);
    progress.xp += 50;
  }
  saveProgress();
  renderResult(pct, passed, "практику");
  showScreen("result");
}

function retryCurrent(){
  if(EXERCISES[activeLevel]) startExercise();
  else startQuiz();
}

/* ============ RESULT ============ */

function renderResult(pct, passed, kind){
  const icon = document.getElementById("result-icon");
  icon.style.background = passed ? "var(--bullBg)" : "var(--bearBg)";
  icon.innerHTML = passed
    ? '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--bull)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--bear)" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  document.getElementById("result-title").textContent = passed
    ? (activeLevel === 10 ? "Экзамен сдан" : "Уровень пройден")
    : "Пока не хватило";
  document.getElementById("result-score").textContent = "Результат: " + pct + "%";
  const need = thresholdFor(activeLevel);
  document.getElementById("result-msg").textContent = passed
    ? (activeLevel === 10 ? "Поздравляем — сертификат теперь открыт." : "Следующий уровень открыт. Продолжайте в том же духе.")
    : `Нужно набрать от ${need}%, чтобы пройти ${kind}. Попробуйте ещё раз.`;
  document.getElementById("retry-btn").style.display = passed ? "none" : "flex";
}

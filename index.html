<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:#0D1321; --surface:#141B2D; --surface2:#1B2338; --border:#28324A;
  --text:#EDEAE0; --textDim:#8A93A8; --textFaint:#525C73;
  --gold:#CBA135; --goldDim:#8A6E28; --bull:#2FA98C; --bear:#D65C5C;
  --bullBg:#12261F; --bearBg:#2A1616; --onGold:#1B1305;
}
[data-theme="light"]{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface2:#EBE8DE; --border:#D9D5C7;
  --text:#1B1F2A; --textDim:#5C6273; --textFaint:#9A968A;
  --gold:#9C7A1F; --goldDim:#C7A94D; --bull:#1E8267; --bear:#B23F3F;
  --bullBg:#E3F0EA; --bearBg:#F5E4E1; --onGold:#FFFFFF;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif; display:flex; justify-content:center;
  min-height:100vh; padding:20px 0;
}
.app{
  width:100%; max-width:420px; min-height:640px; background:var(--bg);
  border-radius:16px; padding:22px 20px 28px; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.screen{display:none; flex-direction:column; flex:1;}
.screen.active{display:flex;}
button{font-family:inherit; cursor:pointer;}
.icon-btn{background:none;border:none;color:var(--textDim);}
.header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.back-btn{background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
.header h2{font-size:16px;font-weight:700;margin:0;line-height:1.3;}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;}
.eyebrow{font-size:11px;color:var(--gold);letter-spacing:1.5px;margin-bottom:6px;}
.h1{font-size:24px;font-weight:700;}
.stat-row{display:flex;gap:10px;margin-bottom:22px;}
.stat-card{flex:1;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:12px 14px;}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;}
.stat-value{font-size:20px;font-weight:600;margin-top:4px;}
.btn-primary{background:var(--gold);color:var(--onGold);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;width:100%;}
.btn-primary:active, .btn-nav:active{transform:scale(0.97);}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.btn-nav{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:12px;font-size:13px;color:var(--text);}
.section-label{font-size:11px;color:var(--textFaint);margin-bottom:10px;letter-spacing:1px;}
.level-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.level-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;}
.level-row.locked{opacity:0.5;}
.level-row.current{background:var(--surface);}
.level-title{font-size:13.5px;font-weight:500;}
.level-topics{font-size:11.5px;color:var(--textDim);}
.progress-bar-row{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;}
.progress-seg{flex:1;min-width:6px;height:3px;border-radius:2px;background:var(--border);}
.lesson-card{flex:1;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
.lesson-title{font-size:17px;font-weight:700;}
.lesson-body{font-size:14px;line-height:1.6;color:var(--textDim);}
.lesson-nav{display:flex;gap:10px;margin-top:18px;}
.quiz-question{font-size:15.5px;font-weight:700;margin-bottom:16px;line-height:1.4;}
.quiz-diagram{margin-bottom:16px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:10px;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.quiz-opt{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;font-size:13.5px;color:var(--text);display:flex;justify-content:space-between;align-items:center;}
.quiz-opt.correct{background:var(--bullBg);border-color:var(--bull);}
.quiz-opt.wrong{background:var(--bearBg);border-color:var(--bear);}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;}
.result-icon{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.settings-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.theme-btn{background:var(--surface2);border:0.5px solid var(--border);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--gold);}
.score-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
svg.candle-icon line, svg.candle-icon rect{transition:none;}
.faint{color:var(--textFaint);font-size:13px;}
</style>
</head>
<body>
<div class="app" id="app" data-theme="dark">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="top-row">
      <div>
        <div class="eyebrow">АКАДЕМИЯ ТРЕЙДИНГА</div>
        <div class="h1 display">С нуля до графика</div>
      </div>
      <button class="icon-btn" onclick="showScreen('settings')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label" style="color:var(--gold)">🏆 XP</div>
        <div class="stat-value mono" id="home-xp">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label" style="color:var(--bull)">✓ Уровни</div>
        <div class="stat-value mono" id="home-levels">0/10</div>
      </div>
    </div>

    <button class="btn-primary" onclick="openNextLevel()">▶ Продолжить обучение</button>

    <div class="nav-grid">
      <button class="btn-nav" onclick="showScreen('progress')">📊 Мой прогресс</button>
      <button class="btn-nav" onclick="showScreen('certificate')">🏅 Сертификат</button>
    </div>

    <div class="section-label mono">ПУТЬ ОБУЧЕНИЯ</div>
    <div class="level-list" id="level-list"></div>
  </div>

  <!-- LESSON -->
  <div class="screen" id="screen-lesson">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display" id="lesson-title"></h2>
    </div>
    <div class="progress-bar-row" id="lesson-progress"></div>
    <div class="lesson-card">
      <svg id="lesson-illustration" width="100%" height="90" viewBox="0 0 260 100"></svg>
      <div class="lesson-title display" id="lesson-slide-title"></div>
      <div class="lesson-body" id="lesson-slide-body"></div>
    </div>
    <div class="lesson-nav">
      <button class="btn-nav" id="lesson-back-btn" style="flex:1;display:none;" onclick="prevSlide()">Назад</button>
      <button class="btn-primary" style="flex:2;margin-bottom:0;" id="lesson-next-btn" onclick="nextSlide()">Далее</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="header">
      <button class="back-btn" onclick="showScreen('lesson')">←</button>
      <h2 class="display" id="quiz-title"></h2>
    </div>
    <div class="progress-bar-row" id="quiz-progress"></div>
    <div class="quiz-diagram" id="quiz-diagram" style="display:none;"></div>
    <div class="quiz-question" id="quiz-question"></div>
    <div class="quiz-opts" id="quiz-opts"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="center-col">
      <div class="result-icon" id="result-icon"></div>
      <div class="display" style="font-size:20px;font-weight:700;" id="result-title"></div>
      <div class="mono" style="font-size:15px;color:var(--textDim);" id="result-score"></div>
      <div class="faint" style="max-width:260px;" id="result-msg"></div>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="btn-nav" id="retry-btn" onclick="retryQuiz()" style="display:none;">↻ Повторить тест</button>
        <button style="background:var(--gold);color:var(--onGold);border:none;border-radius:10px;padding:12px 18px;font-size:13.5px;font-weight:600;" onclick="showScreen('home')">На главную</button>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="screen" id="screen-progress">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display">Мой прогресс</h2>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="faint">Всего XP</div><div class="stat-value mono" id="prog-xp">0</div></div>
      <div class="stat-card"><div class="faint">Пройдено</div><div class="stat-value mono" id="prog-levels">0/10</div></div>
    </div>
    <div class="section-label mono">РЕЗУЛЬТАТЫ ТЕСТОВ</div>
    <div id="prog-scores"></div>
  </div>

  <!-- CERTIFICATE -->
  <div class="screen" id="screen-certificate">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display">Сертификат</h2>
    </div>
    <div class="center-col" id="cert-body"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2 class="display">Настройки</h2>
    </div>
    <div class="settings-row">
      <span style="font-size:13.5px;">Тема оформления</span>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle-btn">🌙</button>
    </div>
    <button class="btn-nav" style="justify-content:center;color:var(--bear);border-color:var(--bear);" onclick="resetProgress()">↻ Сбросить прогресс</button>
  </div>

</div>

<script>
const LEVEL_META = [
  { id: 1, title: "Что такое трейдинг", topics: ["Биржа", "Валютные пары", "Акции", "Индексы", "Крипто"] },
  { id: 2, title: "Японские свечи", topics: ["Тело свечи", "Тени", "Бычья свеча", "Медвежья свеча"] },
  { id: 3, title: "Тренды", topics: ["Восходящий", "Нисходящий", "Боковик"] },
  { id: 4, title: "Поддержка и сопротивление", topics: ["Разметка уровней на графике"] },
  { id: 5, title: "Фигуры", topics: ["Голова и плечи", "Двойная вершина", "Флаг", "Треугольник"] },

  { id: 7, title: "Price Action", topics: ["Свечные модели"] },
  { id: 8, title: "Управление капиталом", topics: ["Риск на сделку", "Психология"] },
  { id: 9, title: "Практика", topics: ["Вход, стоп-лосс, цель на реальном графике"] },
  { id: 10, title: "Экзамен", topics: ["Финальный тест, порог 90%"] },
];

const PASS_THRESHOLD = { 10: 90 };
function thresholdFor(id){ return PASS_THRESHOLD[id] || 70; }

const LESSONS = {

    { q: "Где на графике ниже более логичная точка входа в покупку?", opts: ["Точка A — у уровня поддержки", "Точка B — в середине хаотичного движения", "Точка C — на пустом месте выше графика"], a: 0,
      diagram: 'chart-entry' },
    { q: "Куда логичнее поставить стоп-лосс для этой сделки на покупку?", opts: ["Чуть выше входа", "Чуть ниже уровня поддержки, который отменяет идею", "Ровно на цену входа"], a: 1,
      diagram: 'chart-entry' },
    { q: "Что логичнее выбрать целью сделки?", opts: ["Ближайший значимый уровень сопротивления сверху", "Случайную цену без уровня", "Точку входа ещё раз", "Значение RSI"], a: 0,
      diagram: 'chart-entry' },
  ],
  10: [
    { q: "Что определяет цену на бирже?", opts: ["Баланс спроса и предложения", "Погода", "Решение одного трейдера", "Курс валют вчера"], a: 0 },
    { q: "Что вы получаете, покупая акцию?", opts: ["Долю владения компанией", "Гарантию прибыли", "Валюту страны", "Кредит"], a: 0 },
    { q: "Что показывает тело японской свечи?", opts: ["Расстояние между открытием и закрытием", "Объём торгов", "Название актива", "Время сессии"], a: 0 },
    { q: "Свеча бычья, если", opts: ["Закрытие выше открытия", "Закрытие ниже открытия", "Нет теней", "Тело нулевое"], a: 0 },
    { q: "Что характерно для восходящего тренда?", opts: ["Максимумы и минимумы растут", "Максимумы и минимумы падают", "Цена стоит на месте", "Свечи исчезают"], a: 0 },
    { q: "Поддержка — это зона, где цена", opts: ["Уже несколько раз отталкивалась вверх", "Всегда пробивается", "Совпадает с открытием биржи", "Существует только раз"], a: 0 },
    { q: "Что обычно происходит после уверенного пробоя сопротивления?", opts: ["Оно может стать поддержкой", "Уровень исчезает навсегда", "Торги останавливаются", "Ничего не меняется"], a: 0 },
    { q: "Фигура «голова и плечи» обычно сигнализирует о", opts: ["Развороте тренда вниз", "Продолжении роста", "Начале боковика навсегда", "Росте дивидендов"], a: 0 },
    { q: "Флаг чаще всего заканчивается", opts: ["Продолжением исходного тренда", "Разворотом тренда", "Остановкой торгов", "Ростом дивидендов"], a: 0 },
    { q: "RSI выше 70 обычно интерпретируют как", opts: ["Возможную перекупленность", "Перепроданность", "Отсутствие тренда", "Ошибку расчёта"], a: 0 },
    { q: "MACD строится на основе", opts: ["Схождения-расхождения скользящих средних", "Объёма торгов", "Курса золота", "Числа свечей"], a: 0 },
    { q: "Расширение полос Боллинджера говорит о", opts: ["Росте волатильности", "Падении волатильности до нуля", "Закрытии биржи", "Смене валюты"], a: 0 },
    { q: "Пин-бар отличается", opts: ["Маленьким телом и длинной тенью в одну сторону", "Отсутствием теней", "Огромным телом без теней", "Только зелёным цветом"], a: 0 },
    { q: "Поглощение (engulfing) — это когда", opts: ["Тело свечи полностью перекрывает тело предыдущей", "Свеча меньше предыдущей в 10 раз", "Появляются три одинаковые свечи", "Объём равен нулю"], a: 0 },
    { q: "Сколько капитала обычно рискуют профессионалы в одной сделке?", opts: ["1–2%", "20–30%", "50%", "100%"], a: 0 },
    { q: "Хорошее соотношение риск/прибыль — это когда", opts: ["Прибыль минимум вдвое больше риска", "Риск всегда больше прибыли", "Риск равен нулю", "Прибыль не оценивается заранее"], a: 0 },
    { q: "Хорошая точка входа обычно находится", opts: ["У значимого уровня, а не в хаотичном движении", "Точно в полночь", "На случайной цене", "На пересечении двух валют"], a: 0 },
    { q: "Стоп-лосс логично ставить", opts: ["За уровнем, который отменяет торговую идею", "Ровно на цену входа", "На 50% от депозита", "На случайном числе"], a: 0 },
    { q: "Что из этого — не биржевой актив?", opts: ["Погодный прогноз", "Акция", "Валютная пара", "Индекс"], a: 0 },
    { q: "Что чаще всего заставляет трейдера отклоняться от плана?", opts: ["Страх и жадность", "Слишком низкая комиссия", "Слишком высокий депозит", "Отсутствие интернета"], a: 0 },
  ],
};

let progress = { xp: 0, completed: [], scores: {} };
let activeLevel = 1;
let slideIdx = 0;
let quizIdx = 0;
let quizAnswers = [];
let selectedOpt = null;

function loadProgress(){
  try{
    const raw = localStorage.getItem("ta_progress");
    if(raw) progress = JSON.parse(raw);
  }catch(e){}
}
function saveProgress(){
  localStorage.setItem("ta_progress", JSON.stringify(progress));
}

function isUnlocked(id){ return id === 1 || progress.completed.includes(id - 1); }
function isDone(id){ return progress.completed.includes(id); }
function nextIncompleteLevel(){
  const found = LEVEL_META.find(l => !isDone(l.id));
  return found ? found.id : 1;
}

function showScreen(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  if(name === "home") renderHome();
  if(name === "progress") renderProgress();
  if(name === "certificate") renderCertificate();
}

function candleSvg(status, size){
  const color = status === "done" ? "var(--bull)" : status === "current" ? "var(--gold)" : "var(--textFaint)";
  const fill = status === "locked" ? "none" : color;
  const h = size * 1.4;
  return `<svg class="candle-icon" width="${size}" height="${h}" viewBox="0 0 20 28">
    <line x1="10" y1="1" x2="10" y2="27" stroke="${color}" stroke-width="1.6"/>
    <rect x="4" y="8" width="12" height="12" fill="${fill}" stroke="${color}" stroke-width="1.6" rx="1.5"/>
  </svg>`;
}

function renderHome(){
  document.getElementById("home-xp").textContent = progress.xp;
  document.getElementById("home-levels").textContent = progress.completed.length + "/10";
  const list = document.getElementById("level-list");
  list.innerHTML = "";
  LEVEL_META.forEach(lvl => {
    const unlocked = isUnlocked(lvl.id);
    const done = isDone(lvl.id);
    const status = done ? "done" : unlocked ? "current" : "locked";
    const row = document.createElement("div");
    row.className = "level-row" + (unlocked ? " current" : " locked");
    row.style.cursor = unlocked ? "pointer" : "default";
    row.innerHTML = `
      ${candleSvg(status, 26)}
      <div style="flex:1;">
        <div class="level-title">${lvl.id}. ${lvl.title}</div>
        <div class="level-topics">${lvl.topics.slice(0,3).join(" · ")}</div>
      </div>
      ${!unlocked ? '<span style="color:var(--textFaint);font-size:14px;">🔒</span>' : ""}
      ${done ? '<span style="color:var(--bull);font-size:15px;">✓</span>' : ""}
    `;
    if(unlocked) row.onclick = () => openLevel(lvl.id);
    list.appendChild(row);
  });
}

function openNextLevel(){ openLevel(nextIncompleteLevel()); }

function openLevel(id){
  if(!isUnlocked(id)) return;
  activeLevel = id;
  slideIdx = 0;
  if(id === 10){
    startQuiz();
  } else {
    showScreen("lesson");
    renderLesson();
  }
}

function currentSlides(){ return LESSONS[activeLevel] || []; }
function currentQuiz(){ return QUIZZES[activeLevel] || []; }

function renderLesson(){
  const slides = currentSlides();
  document.getElementById("lesson-title").textContent = `Урок ${activeLevel}: ${LEVEL_META[activeLevel-1].title}`;
  const bar = document.getElementById("lesson-progress");
  bar.innerHTML = slides.map((_, i) => `<div class="progress-seg" style="background:${i <= slideIdx ? 'var(--gold)' : 'var(--border)'}"></div>`).join("");
  document.getElementById("lesson-slide-title").textContent = slides[slideIdx].h;
  document.getElementById("lesson-slide-body").textContent = slides[slideIdx].b;
  document.getElementById("lesson-back-btn").style.display = slideIdx > 0 ? "block" : "none";
  document.getElementById("lesson-next-btn").textContent = slideIdx + 1 < slides.length ? "Далее" : "К тесту →";
  renderIllustration();
}

function renderIllustration(){
  const svg = document.getElementById("lesson-illustration");
  const gold = "var(--gold)", bull = "var(--bull)", bear = "var(--bear)", border = "var(--border)", text = "var(--textDim)";
  switch(activeLevel){
    case 1: {
      const bars = [40,65,30,80,55];
      svg.innerHTML = bars.map((h,i) => `<rect x="${20+i*48}" y="${90-h}" width="26" height="${h}" rx="3" fill="${i === slideIdx % bars.length ? gold : border}"/>`).join("");
      break;
    }
    case 2: {
      const bull2 = slideIdx % 2 === 0;
      const color = bull2 ? bull : bear;
      svg.innerHTML = `<line x1="130" y1="8" x2="130" y2="82" stroke="${color}" stroke-width="2"/><rect x="108" y="${bull2?55:25}" width="44" height="30" fill="${color}" rx="2"/>`;
      break;
    }
    case 3: {
      const paths = [
        "M20,80 L70,60 L110,65 L150,35 L190,40 L240,15",
        "M20,15 L70,35 L110,30 L150,60 L190,55 L240,80",
        "M20,45 L70,50 L110,42 L150,48 L190,44 L240,46",
      ];
      const p = paths[slideIdx % 3] || paths[0];
      svg.innerHTML = `<path d="${p}" fill="none" stroke="${gold}" stroke-width="2.5"/>`;
      break;
    }
    case 4: {
      svg.innerHTML = `<path d="M15,70 L60,35 L100,68 L145,32 L190,66 L240,30" fill="none" stroke="${text}" stroke-width="2"/>
        <line x1="10" y1="70" x2="250" y2="70" stroke="${bull}" stroke-width="1.5" stroke-dasharray="4 3"/>
        <line x1="10" y1="32" x2="250" y2="32" stroke="${bear}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      break;
    }
    case 5: {
      const shapes = [
        "M15,30 L60,55 L90,15 L120,55 L150,20 L180,55 L225,30",
        "M15,30 L90,30 L90,70 L165,70 L225,30",
        "M15,70 L90,70 L165,15 L225,15",
        "M20,60 L100,20 L140,45 L180,30 L230,45",
        "M20,20 L230,20 L20,75 L230,75",
      ];
      svg.innerHTML = `<path d="${shapes[slideIdx % shapes.length]}" fill="none" stroke="${gold}" stroke-width="2.5"/>`;
      break;
    }
    case 6: {
      svg.innerHTML = `<path d="M15,50 Q65,10 115,50 T215,50" fill="none" stroke="${gold}" stroke-width="2.5"/>
        <line x1="10" y1="20" x2="250" y2="20" stroke="${bear}" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="10" y1="80" x2="250" y2="80" stroke="${bull}" stroke-width="1" stroke-dasharray="3 3"/>`;
      break;
    }
    case 7: {
      const bullish = slideIdx % 2 === 0;
      const color = bullish ? bull : bear;
      svg.innerHTML = `<line x1="90" y1="15" x2="90" y2="85" stroke="${color}" stroke-width="2"/><rect x="75" y="${bullish?55:35}" width="30" height="15" fill="${color}" rx="2"/>
        <line x1="170" y1="20" x2="170" y2="60" stroke="${color}" stroke-width="2"/><rect x="152" y="25" width="36" height="30" fill="${color}" rx="2"/>`;
      break;
    }
    case 8: {
      svg.innerHTML = `<circle cx="130" cy="46" r="34" fill="none" stroke="${border}" stroke-width="10"/>
        <path d="M130,12 A34,34 0 0,1 158,60" fill="none" stroke="${gold}" stroke-width="10"/>`;
      break;
    }
    case 9: {
      svg.innerHTML = `<path d="M15,70 L60,35 L100,68 L145,32 L190,66 L240,30" fill="none" stroke="${text}" stroke-width="2"/>
        <circle cx="145" cy="32" r="5" fill="${gold}"/>
        <line x1="10" y1="70" x2="250" y2="70" stroke="${bull}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      break;
    }
    default:
      svg.innerHTML = "";
  }
}

function nextSlide(){
  const slides = currentSlides();
  if(slideIdx + 1 < slides.length){ slideIdx++; renderLesson(); }
  else startQuiz();
}
function prevSlide(){ if(slideIdx>0){ slideIdx--; renderLesson(); } }

function startQuiz(){
  quizIdx = 0; quizAnswers = []; selectedOpt = null;
  showScreen("quiz");
  renderQuiz();
}

function quizDiagramSvg(kind){
  const bull = "var(--bull)", bear = "var(--bear)", gold = "var(--gold)", text = "var(--textDim)";
  if(kind === 'chart-support'){
    return `<svg width="100%" height="90" viewBox="0 0 260 90">
      <path d="M15,65 L60,30 L100,62 L145,28 L190,60 L240,25" fill="none" stroke="${text}" stroke-width="2"/>
      <line x1="10" y1="63" x2="250" y2="63" stroke="${bull}" stroke-width="1.5" stroke-dasharray="4 3"/>
    </svg>`;
  }
  if(kind === 'chart-marks'){
    return `<svg width="100%" height="100" viewBox="0 0 260 100">
      <path d="M15,75 L55,50 L95,78 L140,20 L185,74 L235,18" fill="none" stroke="${text}" stroke-width="2"/>
      <line x1="10" y1="76" x2="250" y2="76" stroke="${gold}" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="252" y="79" font-size="10" fill="${gold}">A</text>
      <line x1="10" y1="48" x2="250" y2="48" stroke="${gold}" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="252" y="51" font-size="10" fill="${gold}">B</text>
      <line x1="10" y1="19" x2="250" y2="19" stroke="${gold}" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="252" y="22" font-size="10" fill="${gold}">C</text>
    </svg>`;
  }
  if(kind === 'chart-practice'){
    return `<svg width="100%" height="90" viewBox="0 0 260 90">
      <path d="M15,78 L55,62 L95,58 L140,42 L185,35 L235,15" fill="none" stroke="${bull}" stroke-width="2.5"/>
    </svg>`;
  }
  if(kind === 'chart-entry'){
    return `<svg width="100%" height="100" viewBox="0 0 260 100">
      <path d="M15,75 L55,48 L95,80 L140,25 L185,78 L235,55" fill="none" stroke="${text}" stroke-width="2"/>
      <line x1="10" y1="78" x2="250" y2="78" stroke="${bull}" stroke-width="1.3" stroke-dasharray="3 3"/>
      <circle cx="95" cy="80" r="5" fill="${gold}"/><text x="100" y="70" font-size="10" fill="${gold}">A</text>
      <circle cx="150" y="55" cx="150" cy="55" r="5" fill="${text}"/><text x="155" y="55" font-size="10" fill="${text}">B</text>
      <circle cx="230" cy="18" r="5" fill="${text}"/><text x="215" y="12" font-size="10" fill="${text}">C</text>
    </svg>`;
  }
  return "";
}

function renderQuiz(){
  const quiz = currentQuiz();
  const isExam = activeLevel === 10;
  document.getElementById("quiz-title").textContent = isExam
    ? `Экзамен: вопрос ${quizIdx+1} из ${quiz.length}`
    : `Тест: вопрос ${quizIdx+1} из ${quiz.length}`;
  const bar = document.getElementById("quiz-progress");
  bar.innerHTML = quiz.map((_,i) => `<div class="progress-seg" style="background:${i<quizIdx?'var(--gold)':i===quizIdx?'var(--textDim)':'var(--border)'}"></div>`).join("");
  const diagBox = document.getElementById("quiz-diagram");
  const q = quiz[quizIdx];
  if(q.diagram){
    diagBox.style.display = "block";
    diagBox.innerHTML = quizDiagramSvg(q.diagram);
  } else {
    diagBox.style.display = "none";
    diagBox.innerHTML = "";
  }
  document.getElementById("quiz-question").textContent = q.q;
  const opts = document.getElementById("quiz-opts");
  opts.innerHTML = "";
  q.opts.forEach((opt,i) => {
    const btn = document.createElement("button");
    btn.className = "quiz-opt";
    btn.textContent = opt;
    btn.onclick = () => pickAnswer(i);
    opts.appendChild(btn);
  });
}

function pickAnswer(i){
  if(selectedOpt !== null) return;
  selectedOpt = i;
  const quiz = currentQuiz();
  const correctIdx = quiz[quizIdx].a;
  const isCorrect = i === correctIdx;
  quizAnswers.push(isCorrect);
  const optButtons = document.querySelectorAll("#quiz-opts .quiz-opt");
  optButtons.forEach((btn, idx) => {
    if(idx === correctIdx) btn.classList.add("correct");
    else if(idx === i) btn.classList.add("wrong");
  });
  setTimeout(() => {
    if(quizIdx + 1 < quiz.length){
      quizIdx++; selectedOpt = null;
      renderQuiz();
    } else {
      finishQuiz();
    }
  }, 650);
}

function finishQuiz(){
  const correctCount = quizAnswers.filter(Boolean).length;
  const pct = Math.round((correctCount / quizAnswers.length) * 100);
  const passed = pct >= thresholdFor(activeLevel);
  progress.scores[activeLevel] = pct;
  progress.xp += correctCount * 10;
  if(passed && !progress.completed.includes(activeLevel)){
    progress.completed.push(activeLevel);
    progress.xp += 50;
  }
  saveProgress();
  renderResult(pct, passed);
  showScreen("result");
}

function renderResult(pct, passed){
  const icon = document.getElementById("result-icon");
  icon.style.background = passed ? "var(--bullBg)" : "var(--bearBg)";
  icon.innerHTML = passed
    ? '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--bull)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--bear)" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  document.getElementById("result-title").textContent = passed
    ? (activeLevel === 10 ? "Экзамен сдан" : "Уровень пройден")
    : "Пока не хватило";
  document.getElementById("result-score").textContent = "Результат: " + pct + "%";
  const need = thresholdFor(activeLevel);
  document.getElementById("result-msg").textContent = passed
    ? (activeLevel === 10 ? "Поздравляем — сертификат теперь открыт." : "Следующий уровень открыт. Продолжайте в том же духе.")
    : `Нужно набрать от ${need}%, чтобы пройти. Попробуйте ещё раз.`;
  document.getElementById("retry-btn").style.display = passed ? "none" : "flex";
}

function retryQuiz(){ startQuiz(); }

function renderProgress(){
  document.getElementById("prog-xp").textContent = progress.xp;
  document.getElementById("prog-levels").textContent = progress.completed.length + "/10";
  const box = document.getElementById("prog-scores");
  const scored = LEVEL_META.filter(l => progress.scores[l.id] !== undefined);
  if(scored.length === 0){
    box.innerHTML = '<div class="faint">Пройдите первый тест, чтобы увидеть статистику здесь.</div>';
    return;
  }
  box.innerHTML = scored.map(l => {
    const pct = progress.scores[l.id];
    const color = pct >= thresholdFor(l.id) ? "var(--bull)" : "var(--bear)";
    return `<div class="score-row"><span style="font-size:13px;">${l.id}. ${l.title}</span><span class="mono" style="font-size:13px;color:${color};">${pct}%</span></div>`;
  }).join("");
}

function renderCertificate(){
  const box = document.getElementById("cert-body");
  if(progress.completed.includes(10)){
    box.innerHTML = `
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.8"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>
      <div class="display" style="font-size:18px;font-weight:700;">Сертификат открыт</div>
      <div class="faint">Поздравляем с завершением курса.</div>`;
  } else {
    box.innerHTML = `
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--textFaint)" stroke-width="1.8"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <div class="display" style="font-size:17px;font-weight:700;">Сертификат пока закрыт</div>
      <div class="faint" style="max-width:260px;">Откроется после сдачи финального экзамена (уровень 10) на 90% и выше.</div>
      <div class="mono" style="font-size:12px;color:var(--gold);margin-top:4px;">Пройдено ${progress.completed.length} из 10 уровней</div>`;
  }
}

function toggleTheme(){
  const app = document.getElementById("app");
  const isDark = app.getAttribute("data-theme") === "dark";
  app.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-toggle-btn").textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("ta_theme", isDark ? "light" : "dark");
}

function resetProgress(){
  progress = { xp: 0, completed: [], scores: {} };
  saveProgress();
  showScreen("home");
}

loadProgress();
const savedTheme = localStorage.getItem("ta_theme") || "dark";
document.getElementById("app").setAttribute("data-theme", savedTheme);
document.getElementById("theme-toggle-btn").textContent = savedTheme === "dark" ? "🌙" : "☀️";
renderHome();
</script>
</body>
</html>
